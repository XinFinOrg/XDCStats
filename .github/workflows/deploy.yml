name: Deploy to Kubernetes

on:
  push:
    branches:
      - master

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: xinfinorg/xdcstats-backend
  FRONTEND_IMAGE: xinfinorg/xdcstats-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: release_net
            namespace: side-services
            kubeconfig_secret: KUBE_CONFIG_RELEASE_NET
          - context: devnet
            namespace: service
            kubeconfig_secret: KUBE_CONFIG_DEV_NET
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig (${{ matrix.context }})
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets[matrix.kubeconfig_secret] }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy backend (${{ matrix.context }})
        run: |
          kubectl set image deployment/stats-1-backend \
            backend=${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.tag }} \
            -n ${{ matrix.namespace }}
          kubectl rollout status deployment/stats-1-backend \
            -n ${{ matrix.namespace }} --timeout=120s

      - name: Deploy frontend (${{ matrix.context }})
        run: |
          kubectl set image deployment/stats-1-frontend \
            frontend=${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.tag }} \
            -n ${{ matrix.namespace }}
          kubectl rollout status deployment/stats-1-frontend \
            -n ${{ matrix.namespace }} --timeout=120s
