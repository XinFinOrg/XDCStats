name: Deploy to Kubernetes

on:
  push:
    branches:
      - master

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: xinfinorg/xdcstats-backend
  FRONTEND_IMAGE: xinfinorg/xdcstats-frontend
  NAMESPACE: service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_URL=http://154.38.175.218:32011
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy backend
        run: |
          kubectl set image deployment/stats-1-backend \
            backend=${{ env.BACKEND_IMAGE }}:${{ env.TAG }} \
            -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/stats-1-backend \
            -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Deploy frontend
        run: |
          kubectl set image deployment/stats-1-frontend \
            frontend=${{ env.FRONTEND_IMAGE }}:${{ env.TAG }} \
            -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/stats-1-frontend \
            -n ${{ env.NAMESPACE }} --timeout=120s
