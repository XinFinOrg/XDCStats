services:
  backend:
    image: xinfinorg/xdcstats-backend:latest
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-2000}:2000"
    environment:
      PORT: "2000"
      WS_SECRET: ${WS_SECRET:-xinfin_xdpos_hybrid_network_stats}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      ENABLE_FORENSICS: ${ENABLE_FORENSICS:-false}
      MONGODBURL: ${MONGODBURL:-localhost:27017}
      MASTERNODE_URL: ${MASTERNODE_URL:-https://master.xinfin.network/api}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_BOOTNODE_HEALTH: ${ENABLE_BOOTNODE_HEALTH:-true}
      BOOTNODE_NETWORK: ${BOOTNODE_NETWORK:-mainnet}
      BOOTNODE_CHECK_INTERVAL: ${BOOTNODE_CHECK_INTERVAL:-60}
      BOOTNODE_CHECK_TIMEOUT: ${BOOTNODE_CHECK_TIMEOUT:-5}
      BOOTNODE_CHECK_PARALLEL: ${BOOTNODE_CHECK_PARALLEL:-8}

  frontend:
    image: xinfinorg/xdcstats-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-32001}:32001"
    environment:
      ENV: ${ENV:-devnet}
      VITE_API_URL: ${VITE_API_URL:-https://stats.devnet.xinfin.org/api}
    depends_on:
      - backend
